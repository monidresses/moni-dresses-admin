<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Admin Login | Moni Dresses</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: { 
        extend: { 
          colors: { 
            primary: "#b3006a", 
            panel: "#0f172a" 
          }, 
          fontFamily: { 
            sans: ["Plus Jakarta Sans", "sans-serif"] 
          } 
        } 
      }
    }
  </script>
</head>
<body class="bg-panel font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Background Decorative Elements -->
  <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Login Card Container -->
  <div class="bg-white w-full max-w-sm rounded-3xl p-8 shadow-2xl space-y-6 text-center relative z-10">
    
    <!-- Header & Brand Logo -->
    <div class="space-y-2">
      <div class="w-16 h-16 bg-primary/10 text-primary rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm border border-primary/20">
        <span class="material-symbols-outlined text-3xl">admin_panel_settings</span>
      </div>
      <h1 class="text-xl font-extrabold text-zinc-900 tracking-wider">MONI DRESSES</h1>
      <p class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">Admin Secure Login</p>
    </div>

    <!-- Admin Login Form -->
    <form id="admin-login-form" class="space-y-4 pt-2">
      
      <!-- Username Input -->
      <div class="text-left space-y-1.5">
        <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider ml-1">Admin ID</label>
        <div class="flex items-center border border-zinc-200 rounded-xl px-3 bg-zinc-50 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all shadow-sm">
          <span class="material-symbols-outlined text-zinc-400 text-[18px]">person</span>
          <input type="text" id="admin-username" required autocomplete="username" placeholder="Enter Username" class="w-full p-3 text-xs font-bold text-zinc-800 bg-transparent focus:outline-none ml-2">
        </div>
      </div>

      <!-- Password Input -->
      <div class="text-left space-y-1.5">
        <label class="block text-[10px] font-bold text-zinc-500 uppercase tracking-wider ml-1">Password</label>
        <div class="flex items-center border border-zinc-200 rounded-xl px-3 bg-zinc-50 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all shadow-sm">
          <span class="material-symbols-outlined text-zinc-400 text-[18px]">lock</span>
          <input type="password" id="admin-password" required autocomplete="current-password" placeholder="Enter Password" class="w-full p-3 text-xs font-bold text-zinc-800 bg-transparent focus:outline-none ml-2">
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="w-full py-4 bg-primary text-white font-extrabold text-xs rounded-xl shadow-lg shadow-primary/30 active:scale-95 transition-all uppercase tracking-wider mt-2 hover:bg-[#920056]">
        Login to Dashboard
      </button>
    </form>
    
    <!-- Security Note -->
    <p class="text-[10px] text-zinc-400 font-medium pt-2">Only authorized personnel are allowed.</p>
  </div>

  <!-- Authentication Logic -->
  <script>
    // 1. Check if the admin is already logged in
    window.addEventListener('DOMContentLoaded', () => {
      const isLoggedIn = localStorage.getItem("isAdminLoggedIn");
      if (isLoggedIn === "true") {
        // Redirect to dashboard if session exists
        window.location.href = "dashboard.html"; 
      }
    });

    // 2. Handle login form submission
    document.getElementById('admin-login-form').addEventListener('submit', function(event) {
      event.preventDefault();
      
      const usernameInput = document.getElementById('admin-username').value.trim();
      const passwordInput = document.getElementById('admin-password').value.trim();

      // Define admin credentials (Update these for production use)
      const validUsername = "admin";
      const validPassword = "moni@123";

      // Validate credentials
      if (usernameInput === validUsername && passwordInput === validPassword) {
        
        // Save secure session in local storage
        localStorage.setItem("isAdminLoggedIn", "true");
        
        // Redirect to the main dashboard panel
        window.location.href = "dashboard.html";
        
      } else {
        alert("Authentication Failed: Incorrect Username or Password!");
        
        // Clear the password field for retry
        document.getElementById('admin-password').value = ""; 
      }
    });
  </script>
</body>
</html>
