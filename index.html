<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — MONI DRESSES</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#b3006a", surface: "#fbf9f8" },
          fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-[400px] p-6 rounded-3xl border border-zinc-200/80 shadow-lg space-y-6">
    
    <!-- HEADER -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-primary/10 text-primary rounded-2xl flex items-center justify-center mx-auto">
        <span class="material-symbols-outlined text-3xl">admin_panel_settings</span>
      </div>
      <h1 class="text-base font-black text-zinc-900 uppercase tracking-wider">Admin Portal</h1>
      <p class="text-xs text-zinc-400">Sign in to manage Moni Dresses store</p>
    </div>

    <!-- LOGIN FORM -->
    <form id="admin-login-form" class="space-y-4">
      <div class="space-y-1">
        <label class="text-[11px] font-bold text-zinc-600 uppercase tracking-wider">Admin Email</label>
        <div class="flex items-center bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 focus-within:border-primary transition-all">
          <span class="material-symbols-outlined text-zinc-400 text-sm mr-2">mail</span>
          <input type="email" id="admin-email" placeholder="admin@monidresses.com" required class="w-full bg-transparent text-xs text-zinc-800 focus:outline-none font-medium">
        </div>
      </div>

      <div class="space-y-1">
        <label class="text-[11px] font-bold text-zinc-600 uppercase tracking-wider">Password</label>
        <div class="flex items-center bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2.5 focus-within:border-primary transition-all">
          <span class="material-symbols-outlined text-zinc-400 text-sm mr-2">lock</span>
          <input type="password" id="admin-password" placeholder="••••••••" required class="w-full bg-transparent text-xs text-zinc-800 focus:outline-none font-medium">
        </div>
      </div>

      <button type="submit" id="login-btn" class="w-full py-3.5 bg-primary text-white text-xs font-extrabold rounded-xl shadow-md active:scale-95 transition-all uppercase tracking-wider">
        Login to Dashboard
      </button>
    </form>

    <!-- ERROR MESSAGE -->
    <div id="error-box" class="hidden p-3 bg-rose-50 border border-rose-200 text-rose-600 text-xs font-bold rounded-xl text-center">
      Invalid email or password!
    </div>

  </div>

  <!-- FIREBASE LOGIN SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZdG23Io-oMElZ5XVmhVLd87-sq136dhY",
      authDomain: "moni-dresses-db.firebaseapp.com",
      projectId: "moni-dresses-db",
      storageBucket: "moni-dresses-db.firebasestorage.app",
      messagingSenderId: "24076547918",
      appId: "1:24076547918:web:6cae50157f9c6749ff501f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById('admin-login-form');
    const errorBox = document.getElementById('error-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;
      const btn = document.getElementById('login-btn');

      btn.innerText = "Logging in...";
      errorBox.classList.add('hidden');

      try {
        // Firebase Authentication Check
        await signInWithEmailAndPassword(auth, email, password);
        
        // Save login status in localStorage
        localStorage.setItem('isAdminLoggedIn', 'true');
        
        // Redirect to dashboard page
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error("Login error: ", error);
        errorBox.classList.remove('hidden');
        btn.innerText = "Login to Dashboard";
      }
    });
  </script>
</body>
</html>
