<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Admin Dashboard | Moni Dresses</title>
  
  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 flex">

  <!-- Sidebar Navigation -->
  <aside class="w-64 bg-slate-900 min-h-screen text-white fixed">
    <div class="p-6">
      <h1 class="text-xl font-bold text-pink-500">Moni Admin</h1>
    </div>
    
    <nav class="mt-4 px-3 space-y-1">
      <a href="index.html" class="flex items-center gap-3 p-3 bg-pink-700 rounded-lg text-sm font-semibold">
        <span class="material-symbols-outlined">dashboard</span> Dashboard
      </a>
      <a href="orders.html" class="flex items-center gap-3 p-3 hover:bg-slate-800 rounded-lg text-sm font-semibold text-slate-400">
        <span class="material-symbols-outlined">shopping_bag</span> Orders
      </a>
      <a href="products.html" class="flex items-center gap-3 p-3 hover:bg-slate-800 rounded-lg text-sm font-semibold text-slate-400">
        <span class="material-symbols-outlined">inventory_2</span> Products
      </a>
      <a href="customers.html" class="flex items-center gap-3 p-3 hover:bg-slate-800 rounded-lg text-sm font-semibold text-slate-400">
        <span class="material-symbols-outlined">group</span> Customers
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="ml-64 p-8 w-full">
    <header class="flex justify-between items-center mb-8">
      <h2 class="text-2xl font-bold text-slate-800">Welcome back, Admin!</h2>
      <button class="bg-white px-4 py-2 rounded-lg border border-slate-200 text-sm font-bold shadow-sm">
        Log Out
      </button>
    </header>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <p class="text-slate-500 text-xs font-bold uppercase">Total Orders</p>
        <h3 class="text-3xl font-black mt-2">1,248</h3>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <p class="text-slate-500 text-xs font-bold uppercase">Total Revenue</p>
        <h3 class="text-3xl font-black mt-2">₹4,50,000</h3>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <p class="text-slate-500 text-xs font-bold uppercase">Total Customers</p>
        <h3 class="text-3xl font-black mt-2">892</h3>
      </div>
    </div>
  </main>

  <script>
    // Firebase initialization script will go here later
  </script>
</body>
</html>
