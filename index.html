<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin Login — MONI DRESSES</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#fbf9f8] min-h-screen flex items-center justify-center p-4">
  <main class="bg-white w-full max-w-sm p-7 rounded-3xl border border-zinc-200 shadow-xl space-y-6">
    <header class="text-center"><h1 class="text-xl font-black text-[#b3006a] tracking-wider">MONI DRESSES</h1><p class="text-xs text-zinc-400 mt-1">Secure Admin Control Panel</p></header>
    <form id="admin-form" class="space-y-4">
      <input type="email" id="admin-email" autocomplete="username" required placeholder="Admin Email" class="w-full p-3 text-xs border border-zinc-200 rounded-xl bg-zinc-50 focus:outline-none focus:border-[#b3006a]">
      <input type="password" id="admin-password" autocomplete="current-password" required placeholder="Password" class="w-full p-3 text-xs border border-zinc-200 rounded-xl bg-zinc-50 focus:outline-none focus:border-[#b3006a]">
      <button id="admin-btn" class="w-full py-3.5 bg-[#b3006a] text-white text-xs font-extrabold rounded-xl">LOGIN TO ADMIN</button>
      <p id="error-box" class="hidden p-3 bg-rose-50 border border-rose-200 text-rose-600 text-xs font-bold rounded-xl text-center"></p>
    </form>
  </main>
  <script type="module">
    import { auth, db } from './db.js';
    import { signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
    const form = document.getElementById('admin-form');
    const btn = document.getElementById('admin-btn');
    const error = document.getElementById('error-box');
    const showError = message => { error.textContent = message; error.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'LOGIN TO ADMIN'; };
    onAuthStateChanged(auth, async user => {
      if (!user) return;
      const profile = await getDoc(doc(db, 'users', user.uid));
      const role = profile.exists() ? profile.data().role : null;
      if (role === 'admin' || role === 'superadmin') window.location.replace('dashboard.html');
      else await auth.signOut();
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      btn.disabled = true; btn.textContent = 'AUTHENTICATING...'; error.classList.add('hidden');
      try {
        const credential = await signInWithEmailAndPassword(auth, document.getElementById('admin-email').value.trim(), document.getElementById('admin-password').value);
        const profile = await getDoc(doc(db, 'users', credential.user.uid));
        const role = profile.exists() ? profile.data().role : null;
        if (role !== 'admin' && role !== 'superadmin') { await auth.signOut(); return showError('This account is not authorized for the Admin Panel.'); }
        window.location.replace('dashboard.html');
      } catch (e) { showError('Invalid admin credentials or Firebase configuration.'); console.error(e); }
    });
  </script>
</body>
</html>
