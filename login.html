<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — MONI DRESSES</title></head><body><main><h1>Admin Login</h1><form id="login"><input id="email" type="email" autocomplete="email" placeholder="Admin email" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button>Sign in</button></form><p id="message" role="alert"></p></main><script type="module">import{signInWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';import{auth}from'./db.js';const f=document.getElementById('login'),m=document.getElementById('message');f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='Signing in…';try{await signInWithEmailAndPassword(auth,email.value,password.value);const r=new URLSearchParams(location.search).get('redirect')||'dashboard.html';location.href=`/${r}`}catch(err){console.error(err);m.textContent='Invalid credentials or sign-in unavailable.'}});</script></body></html>
