<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Admin Dashboard — MONI DRESSES</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: "#b3006a", surface: "#fbf9f8" },
          fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-zinc-900 font-sans min-h-screen pb-12">

  <!-- HEADER -->
  <header class="bg-white border-b border-zinc-200 px-6 py-4 flex justify-between items-center sticky top-0 z-30 shadow-sm">
    <h1 class="text-base font-extrabold text-primary uppercase tracking-wider">Moni Dresses — Admin Dashboard</h1>
    <button onclick="fetchOrders()" class="flex items-center gap-1.5 px-3 py-2 bg-primary/10 text-primary font-bold text-xs rounded-xl hover:bg-primary/20 transition-all">
      <span class="material-symbols-outlined text-sm">refresh</span> Refresh Orders
    </button>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
    <div class="flex justify-between items-center">
      <h2 class="text-sm font-bold text-zinc-500 uppercase tracking-wider">Live Customer Orders</h2>
      <span id="order-count" class="text-xs bg-zinc-200 text-zinc-700 font-extrabold px-2.5 py-1 rounded-full">0 Orders</span>
    </div>

    <!-- ORDERS LIST CONTAINER -->
    <div id="orders-container" class="space-y-4">
      <p class="text-center text-zinc-400 text-xs py-10">Loading orders from Firebase...</p>
    </div>
  </main>

  <!-- ADMIN OTP VERIFICATION MODAL -->
  <div id="admin-otp-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl space-y-4 text-center">
      <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto">
        <span class="material-symbols-outlined text-2xl">lock_person</span>
      </div>
      <div>
        <h3 class="text-sm font-bold text-zinc-800">Customer OTP Verification Required</h3>
        <p class="text-xs text-zinc-500 mt-1">To modify or cancel this order, enter the OTP sent to customer phone: <span id="target-phone-display" class="font-bold text-zinc-800"></span></p>
      </div>
      <input type="text" id="admin-otp-input" maxlength="4" placeholder="Enter 4-digit OTP" class="w-full text-center tracking-[0.8em] text-lg font-bold p-3 border border-zinc-300 rounded-xl focus:outline-primary bg-zinc-50">
      <button onclick="verifyAndExecuteAdminAction()" class="w-full py-3 bg-primary text-white font-bold text-xs rounded-xl shadow-md active:scale-95 transition-all uppercase">Verify & Update Order</button>
      <button onclick="closeModal()" class="text-xs font-bold text-zinc-400 hover:text-zinc-600 block mx-auto">Cancel</button>
    </div>
  </div>

  <!-- FIREBASE & ADMIN SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZdG23Io-oMElZ5XVmhVLd87-sq136dhY",
      authDomain: "moni-dresses-db.firebaseapp.com",
      projectId: "moni-dresses-db",
      storageBucket: "moni-dresses-db.firebasestorage.app",
      messagingSenderId: "24076547918",
      appId: "1:24076547918:web:6cae50157f9c6749ff501f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentSelectedDocId = null;
    let targetNewStatus = null;
    let generatedCustomerOTP = "1234"; // Testing OTP (Can be integrated with SMS Gateway later)
    let targetCustomerPhone = "";

    window.fetchOrders = async function() {
      const container = document.getElementById('orders-container');
      container.innerHTML = `<p class="text-center text-zinc-400 text-xs py-10">Fetching latest orders...</p>`;

      try {
        const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);
        
        container.innerHTML = "";
        document.getElementById('order-count').innerText = `${querySnapshot.size} Orders`;

        if (querySnapshot.empty) {
          container.innerHTML = `<p class="text-center text-zinc-400 text-xs py-10">No orders found in database.</p>`;
          return;
        }

        querySnapshot.forEach((documentSnap) => {
          const data = documentSnap.data();
          const docId = documentSnap.id;

          // Format Date and Time properly
          let formattedDate = "N/A";
          if (data.createdAt && data.createdAt.toDate) {
            formattedDate = data.createdAt.toDate().toLocaleString('en-IN', {
              day: '2-digit', month: 'short', year: 'numeric', 
              hour: '2-digit', minute: '2-digit', hour12: true
            });
          }

          // Build items list HTML
          let itemsHtml = "";
          if (data.items && Array.isArray(data.items)) {
            data.items.forEach(item => {
              itemsHtml += `<div class="flex justify-between text-xs text-zinc-600 py-0.5">
                <span>${item.name || 'Product'} (Qty: ${item.qty || 1})</span>
                <span class="font-bold">₹${item.price * (item.qty || 1)}</span>
              </div>`;
            });
          }

          // Status Badge Color
          let statusColor = "bg-amber-100 text-amber-700";
          if (data.status === "Cancelled") statusColor = "bg-rose-100 text-rose-700";
          if (data.status === "Shipped" || data.status === "Completed") statusColor = "bg-emerald-100 text-emerald-700";

          const card = document.createElement('div');
          card.className = "bg-white p-5 rounded-2xl border border-zinc-200 shadow-sm space-y-4";
          card.innerHTML = `
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-zinc-100 pb-3 gap-2">
              <div>
                <span class="text-xs font-black text-primary">${data.orderId || 'MD-ORDER'}</span>
                <p class="text-[11px] text-zinc-400 font-semibold mt-0.5">Ordered on: ${formattedDate}</p>
              </div>
              <span class="text-[10px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider ${statusColor}">${data.status || 'Pending'}</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
              <div class="space-y-1 bg-zinc-50 p-3 rounded-xl">
                <p class="font-bold text-zinc-800">Customer: ${data.customer?.name || 'N/A'}</p>
                <p class="text-zinc-600 font-medium">Phone: +91 ${data.customer?.phone || 'N/A'}</p>
                <p class="text-zinc-500 leading-relaxed">Address: ${data.customer?.address || ''}, ${data.customer?.city || ''} - ${data.customer?.pinCode || ''}</p>
              </div>

              <div class="space-y-1.5 bg-zinc-50 p-3 rounded-xl">
                <p class="font-bold text-zinc-700 mb-1">Purchased Items:</p>
                ${itemsHtml}
                <div class="border-t border-zinc-200 pt-2 flex justify-between font-black text-zinc-900 text-xs">
                  <span>Total Amount (${data.financials?.paymentMethod?.toUpperCase() || 'COD'})</span>
                  <span class="text-primary">₹${data.financials?.totalAmount || 0}</span>
                </div>
              </div>
            </div>

            <div class="flex flex-wrap gap-2 pt-2 border-t border-zinc-100">
              <button onclick="requestOTPAction('${docId}', '${data.customer?.phone}', 'Processing')" class="px-3 py-1.5 bg-zinc-100 hover:bg-zinc-200 text-zinc-700 font-bold text-[11px] rounded-lg transition-all">Mark Processing</button>
              <button onclick="requestOTPAction('${docId}', '${data.customer?.phone}', 'Shipped')" class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold text-[11px] rounded-lg transition-all">Mark Shipped</button>
              <button onclick="requestOTPAction('${docId}', '${data.customer?.phone}', 'Cancelled')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-[11px] rounded-lg transition-all ml-auto">Cancel Order</button>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (error) {
        console.error("Error loading orders: ", error);
        container.innerHTML = `<p class="text-center text-rose-500 text-xs py-10">Failed to load orders: ${error.message}</p>`;
      }
    };

    // Trigger OTP modal before changing order status
    window.requestOTPAction = function(docId, phone, newStatus) {
      currentSelectedDocId = docId;
      targetNewStatus = newStatus;
      targetCustomerPhone = phone;
      
      document.getElementById('target-phone-display').innerText = "+91 " + phone;
      document.getElementById('admin-otp-input').value = "";
      document.getElementById('admin-otp-modal').classList.remove('hidden');

      // For testing, default OTP is set to 1234. In production, trigger SMS API here.
      alert(`OTP sent to customer (+91 ${phone}). For testing, use OTP: 1234`);
    };

    // Verify OTP and update Firestore database
    window.verifyAndExecuteAdminAction = async function() {
      const enteredOtp = document.getElementById('admin-otp-input').value.trim();

      if (enteredOtp === generatedCustomerOTP) {
        try {
          const docRef = doc(db, "orders", currentSelectedDocId);
          await updateDoc(docRef, {
            status: targetNewStatus
          });

          alert(`Order successfully updated to '${targetNewStatus}'!`);
          closeModal();
          fetchOrders(); // Refresh list
        } catch (err) {
          alert("Database update failed: " + err.message);
        }
      } else {
        alert("Incorrect OTP! Action restricted.");
      }
    };

    window.closeModal = function() {
      document.getElementById('admin-otp-modal').classList.add('hidden');
    }

    // Auto-fetch orders on page load
    window.addEventListener('DOMContentLoaded', () => {
      fetchOrders();
    });
  </script>
</body>
</html>
