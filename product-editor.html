<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Price Editor | MONI DRESSES</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 min-h-screen p-6"><main class="max-w-xl mx-auto bg-white rounded-2xl shadow p-6"><h1 class="text-2xl font-bold">Product Price Editor</h1><p class="text-sm text-slate-500 mt-1">Prices saved here become the authoritative checkout prices.</p><form id="product-form" class="space-y-4 mt-6"><label class="block text-sm font-semibold">Product ID<input id="id" required class="mt-1 w-full border rounded-lg p-3"></label><label class="block text-sm font-semibold">Product name<input id="name" required class="mt-1 w-full border rounded-lg p-3"></label><label class="block text-sm font-semibold">SKU<input id="sku" class="mt-1 w-full border rounded-lg p-3"></label><label class="block text-sm font-semibold">Selling price (₹)<input id="price" type="number" min="0" step="0.01" required class="mt-1 w-full border rounded-lg p-3"></label><label class="flex gap-2 items-center"><input id="active" type="checkbox" checked> Active for sale</label><button class="w-full bg-black text-white rounded-lg p-3 font-bold">Save Product</button></form><p id="message" class="mt-4 text-sm" role="alert"></p></main><script type="module" src="js/product-editor.js"></script></body></html>
